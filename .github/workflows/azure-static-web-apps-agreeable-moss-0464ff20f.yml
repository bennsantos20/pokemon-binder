name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

permissions:
  contents: read

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Validate, Build and Deploy
    permissions:
      contents: read
      pull-requests: write # Azure preview comments; no repository-content write access.
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
          lfs: false
          persist-credentials: false
      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci --include=dev
      - name: Run automated tests
        run: npm test
      - name: Validate TypeScript
        run: npx tsc -b
      - name: Run Oxlint
        run: npm run lint
      - name: Build production site
        run: npm run build
      - name: Deploy validated production output
        id: builddeploy
        # Fork PRs still run checks but cannot access the deployment secret.
        if: >-
          success() &&
          ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository))
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_AGREEABLE_MOSS_0464FF20F }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "dist"
          api_location: ""
          output_location: ""
          skip_app_build: true
          production_branch: "main"

  close_pull_request_job:
    if: >-
      github.event_name == 'pull_request' && github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    name: Close Pull Request Preview
    permissions: {}
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_AGREEABLE_MOSS_0464FF20F }}
          action: "close"
